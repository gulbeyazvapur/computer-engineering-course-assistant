<svg width="320" height="200" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <filter id="saGroundBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="saSoftDrop" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#1F2025" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- soft ground shadow under the whole composition -->
  <ellipse cx="170" cy="182" rx="110" ry="8" fill="#1F2025" opacity="0.13" filter="url(#saGroundBlur)" />

  <!-- single, very soft organic backdrop shape (no decorative x-marks anywhere) -->
  <path
    d="M55 100C50 55 100 15 165 18C230 21 275 55 278 100C281 145 240 180 170 182C100 184 60 145 55 100Z"
    fill="#FFF5F8"
    opacity="0.5"
  />
  <circle cx="264" cy="96" r="2.6" fill="#E7E4EA" opacity="0.7" />

  <!-- pot: fully visible, sitting clear of the book stack, nothing overlapping it -->
  <path d="M33,140 H65 A3,3 0 0 1 68,143 V144 A3,3 0 0 1 65,147 H33 A3,3 0 0 1 30,144 V143 A3,3 0 0 1 33,140 Z" fill="#E7E4EA" />
  <path
    d="M32,147 H66 L61,167 A3,3 0 0 1 58,170 H40 A3,3 0 0 1 37,167 Z"
    fill="#FAFAFC"
    stroke="#E7E4EA"
    stroke-width="1.2"
  />
  <path d="M36,148c2,1.8 6,2.8 13,2.8s11,-1 13,-2.8" stroke="#1F2025" stroke-opacity="0.1" stroke-width="1.2" fill="none" />

  <!-- stem rises straight from the pot's own center -->
  <path d="M49,140c-2,-16 1,-30 4,-42" stroke="#687650" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- plant: 6 leaves fanning from the same center point as the pot, so pot + stem + leaves read as one object -->
  <!-- kept in its natural green (not tinted pink), per design direction -->
  <path d="M49,101C36,92 22,86 8,84C18,94 32,100 49,101Z" fill="#687650" opacity="0.85" />
  <path d="M51,99C41,90 34,84 28,80C33,88 41,94 51,99Z" fill="#7B8961" />
  <path d="M50,100C38,88 24,78 15,68C22,82 34,92 50,100Z" fill="#687650" />
  <path d="M52,98C47,76 47,50 58,24C64,50 63,76 52,98Z" fill="#7B8961" />
  <path d="M53,97C66,84 80,68 92,50C86,70 72,86 53,97Z" fill="#687650" />
  <path d="M54,96C63,88 71,80 78,68C72,80 62,88 54,96Z" fill="#7B8961" />
  <path d="M52,96c-4,-20 -4,-42 4,-62" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" fill="none" />
  <path d="M54,95c11,-13 22,-26 33,-40" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" fill="none" />

  <!-- book stack: three covers, same center axis, clearly stacked (no tilt, no offset) -->
  <g filter="url(#saSoftDrop)">
    <path
      d="M81,138 H219 A6,6 0 0 1 225,144 V158 A6,6 0 0 1 219,164 H81 A6,6 0 0 1 75,158 V144 A6,6 0 0 1 81,138 Z"
      fill="#7566B8"
    />
    <path
      d="M92.5,114 H207.5 A5,5 0 0 1 212.5,119 V133 A5,5 0 0 1 207.5,138 H92.5 A5,5 0 0 1 87.5,133 V119 A5,5 0 0 1 92.5,114 Z"
      fill="#F0EEFA"
      stroke="#E7E4EA"
      stroke-width="1.5"
    />
    <path
      d="M105,92 H195 A5,5 0 0 1 200,97 V109 A5,5 0 0 1 195,114 H105 A5,5 0 0 1 100,109 V97 A5,5 0 0 1 105,92 Z"
      fill="#EC3F77"
    />
  </g>

  <!-- page-block detail, fully inset within each cover so nothing pokes past the aligned edges -->
  <rect x="210" y="142" width="9" height="18" rx="2" fill="#5F5296" />
  <rect x="196" y="118" width="8" height="15" rx="2" fill="#E7E4EA" />
  <rect x="182" y="96" width="8" height="13" rx="2" fill="#D92E68" />

  <!-- top-edge light catch on the bottom and middle covers only -->
  <path d="M85,142 H215" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
  <path d="M95,118 H205" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.3" stroke-linecap="round" />

  <!-- small title-label detail on the middle cover -->
  <rect x="100" y="124" width="26" height="5" rx="2.5" fill="#EC3F77" opacity="0.85" />

  <!-- mug: right of the stack, pink, with </> mark and light steam -->
  <ellipse cx="246" cy="178" rx="34" ry="6" fill="#E7E4EA" opacity="0.5" />

  <g filter="url(#saSoftDrop)">
    <path
      d="M222,110 H270 A3,3 0 0 1 273,113 V152 A16,16 0 0 1 257,168 H235 A16,16 0 0 1 219,152 V113 A3,3 0 0 1 222,110 Z"
      fill="#EC3F77"
    />
    <ellipse cx="246" cy="113" rx="25" ry="6" fill="#D92E68" />
  </g>

  <ellipse cx="246" cy="112" rx="18" ry="3.8" fill="#1F2025" opacity="0.3" />
  <path d="M230,110c8,-4 26,-4 34,1" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <path
    d="M264,120 C284,118 297,126 296,135 C295,144 283,151 264,149 L264,143 C278,144 287,139 288,135 C289,129 280,124 264,126 Z"
    fill="#D92E68"
  />
  <path d="M270,125C282,124 290,129 290,134" stroke="#EC3F77" stroke-width="2.2" stroke-opacity="0.5" stroke-linecap="round" fill="none" />

  <path d="M234,104c3,-5 -3,-7 0,-12c3,-5 -3,-7 0,-11" stroke="#1F2025" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M250,101c3,-5 -3,-7 0,-11" stroke="#1F2025" stroke-opacity="0.2" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <text
    x="246"
    y="150"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="15"
    font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
  >&lt;/&gt;</text>
</svg>
